<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資理財小幫手</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="投資小幫手">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            50: '#f6f8f7',
                            100: '#eaf0ec',
                            200: '#d5e0d9',
                            300: '#b7c9c0',
                            400: '#91a89c',
                            500: '#6f887c',
                            600: '#566e63',
                            700: '#43564e',
                            800: '#36453f',
                            900: '#2d3a35',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        input, select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            min-height: 44px;
        }
        select {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%236B7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3E%3C/svg%3E");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.25em 1.25em;
            padding-right: 2.25rem !important;
        }
    </style>
</head>
<body class="bg-morandi-50 text-slate-700 min-h-screen flex flex-col pb-28 select-none font-sans antialiased">

    <header class="bg-morandi-100/95 backdrop-blur-md text-morandi-800 border-b border-morandi-200/60 sticky top-0 z-50 pt-10 pb-3 transition-colors duration-300 shadow-sm">
        <div class="max-w-md mx-auto px-5 flex justify-between items-center">
            <h1 class="text-sm tracking-wide font-bold flex items-center gap-2 text-morandi-800">
                <span class="text-base">📈</span> 投資理財小幫手
            </h1>
            <div id="user-info" class="hidden flex items-center space-x-2.5">
                <span id="user-email" class="text-[11px] tracking-tight bg-morandi-200/80 text-morandi-800 px-2.5 py-1 rounded-full truncate max-w-[110px]"></span>
                <button onclick="handleLogout()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded-lg text-[11px] font-medium transition">登出</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-4 flex-grow w-full">

        <!-- 登入畫面 -->
        <div id="login-section" class="bg-white p-7 rounded-3xl shadow-sm border border-morandi-100 mt-8">
            <div class="text-center mb-7">
                <div class="w-12 h-12 bg-morandi-100 text-morandi-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">🌿</div>
                <h2 class="text-lg font-bold text-morandi-800 tracking-wide">使用者登入</h2>
                <p class="text-xs text-slate-400 mt-1">歡迎回到您的個人投資追蹤看板</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4" autocomplete="off">
                <div class="relative">
                    <label class="block text-[11px] font-medium text-slate-500 mb-1 tracking-wider">EMAIL</label>
                    <input type="email" id="email" required autocomplete="off" onfocus="showEmailHistoryDropdown()" onblur="setTimeout(hideEmailHistoryDropdown, 200)" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                    <div id="email-history-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-2xl shadow-lg z-50 overflow-hidden divide-y divide-slate-100 max-h-40 overflow-y-auto"></div>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1 tracking-wider">PASSWORD</label>
                    <input type="password" id="password" required autocomplete="new-password" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition" value="">
                </div>
                <button type="submit" id="login-btn" class="w-full h-11 bg-morandi-500 hover:bg-morandi-600 text-white font-medium rounded-2xl transition shadow-sm text-xs tracking-wide">登入系統</button>
                <p id="login-error" class="text-rose-600 text-xs text-center font-medium hidden mt-3 p-2.5 bg-rose-50 rounded-xl border border-rose-100"></p>
            </form>
        </div>

        <!-- 登入後的主畫面容器 -->
        <div id="app-section" class="hidden space-y-4">
            
            <!-- 分頁一：持股總覽 -->
            <div id="panel-summary" class="space-y-3.5">
                <div class="bg-gradient-to-br from-morandi-100 via-morandi-200/70 to-morandi-100 text-morandi-800 p-5 rounded-3xl shadow-sm border border-morandi-200/80 space-y-3.5 relative overflow-hidden">
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <p class="text-xs text-morandi-600 font-medium tracking-wide">總資產市值 (NTD)</p>
                            <h2 id="total-market-value" class="text-2xl font-bold mt-0.5 tracking-tight text-morandi-900">NT$ 0</h2>
                        </div>
                        <span id="total-symbols" class="text-[11px] bg-morandi-300/40 text-morandi-800 px-3 py-1 rounded-full font-medium tracking-wide border border-morandi-300/60">0 檔持有中</span>
                    </div>

                    <div class="grid grid-cols-2 pt-3 border-t border-morandi-300/50 text-xs relative z-10">
                        <div>
                            <span class="text-morandi-600 block text-[11px] mb-0.5">總投入成本</span>
                            <b id="total-invested" class="text-morandi-900 text-sm tracking-tight">NT$ 0</b>
                        </div>
                        <div class="text-right">
                            <span class="text-morandi-600 block text-[11px] mb-0.5">累積配息總額</span>
                            <b id="total-dividend" class="text-amber-700 text-sm tracking-tight">NT$ 0</b>
                        </div>
                    </div>

                    <div id="total-profit-box" class="pt-2.5 border-t border-morandi-300/50 text-xs flex justify-between items-center relative z-10">
                        <span class="text-morandi-600">總未實現損益</span>
                        <b class="text-morandi-900">NT$ 0 (0.00%)</b>
                    </div>
                </div>

                <div id="portfolio-list" class="space-y-3.5"></div>
            </div>

            <!-- 分頁二：行情追蹤 -->
            <div id="panel-market" class="hidden space-y-3.5">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <h3 class="text-xs font-bold text-morandi-800 tracking-wide">📈 市場行情與淨值追蹤看板</h3>
                        <p class="text-[10px] text-slate-400 mt-0.5">Yahoo Finance 即時行情同步</p>
                    </div>
                    <button id="refresh-market-btn" onclick="fetchMarketData()" class="bg-morandi-500 hover:bg-morandi-600 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                        🔄 更新行情
                    </button>
                </div>

                <!-- 三大子分頁 -->
                <div class="grid grid-cols-3 gap-1 bg-slate-200/60 p-1 rounded-2xl shadow-inner text-xs font-bold">
                    <button onclick="switchMarketTab('watchlist')" id="mtab-watchlist" class="py-2 rounded-xl transition bg-white text-morandi-700 shadow-sm flex items-center justify-center gap-1">
                        ⭐ 我的追蹤
                    </button>
                    <button onclick="switchMarketTab('stock')" id="mtab-stock" class="py-2 rounded-xl transition text-slate-500 flex items-center justify-center gap-1">
                        📈 股票/ETF
                    </button>
                    <button onclick="switchMarketTab('fund')" id="mtab-fund" class="py-2 rounded-xl transition text-slate-500 flex items-center justify-center gap-1">
                        💡 共同基金
                    </button>
                </div>

                <!-- 搜尋列與排序按鈕 -->
                <div class="flex gap-2 items-center">
                    <div class="relative flex-grow">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">🔍</span>
                        <input type="text" id="market-search-input" oninput="renderMarketList()" placeholder="輸入代號或名稱快速搜尋..." class="w-full h-11 pl-9 pr-4 bg-white border border-slate-200 rounded-2xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-morandi-300 transition shadow-sm">
                    </div>
                    <button id="sort-watchlist-btn" onclick="openSortModal()" class="bg-morandi-100 hover:bg-morandi-200 text-morandi-800 px-4 h-11 rounded-2xl text-xs font-bold transition shadow-sm whitespace-nowrap flex items-center border border-morandi-200">
                        排序
                    </button>
                </div>

                <div id="market-list" class="space-y-3.5"></div>
            </div>

            <!-- 分頁三：記帳登記 -->
            <div id="panel-add" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="text-sm font-bold mb-4 text-morandi-800 tracking-wide flex items-center gap-1.5">✍️ 新增交易 / 配息紀錄</h3>
                <form id="transaction-form" onsubmit="handleAddTransaction(event)" class="space-y-3.5">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">日期</label>
                            <input type="date" id="tx-date" required class="w-full h-11 px-3 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">動作</label>
                            <select id="tx-action" onchange="onActionChange()" class="w-full h-11 px-3 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 font-semibold text-morandi-700 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                                <option value="BUY">🟢 買進</option>
                                <option value="SELL">🔴 賣出</option>
                                <option value="DIVIDEND">💰 配息 / 股利</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">資產類型</label>
                            <select id="tx-type" onchange="onTypeChange()" class="w-full h-11 px-3 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                                <option value="stock">股票 / ETF</option>
                                <option value="fund">基金</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">代號</label>
                            <input type="text" id="tx-symbol" required placeholder="例 2330" oninput="onSymbolInput()" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl text-xs uppercase bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                        </div>
                    </div>

                    <div id="fund-hint-text" class="hidden -mt-1 text-[10px] text-morandi-600 font-medium px-1 flex items-center gap-1">
                        💡 基金請輸入代碼
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">名稱</label>
                        <input type="text" id="tx-name" required placeholder="例 台積電" oninput="onNameInput()" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                    </div>

                    <div id="buy-sell-fields" class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">股數/單位</label>
                            <input type="number" step="any" id="tx-shares" value="0" class="w-full h-11 px-2.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">單價/淨值</label>
                            <input type="number" step="any" id="tx-price" value="0" class="w-full h-11 px-2.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">手續費/稅</label>
                            <input type="number" step="any" id="tx-fee" value="0" class="w-full h-11 px-2.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                        </div>
                    </div>

                    <div id="dividend-fields" class="hidden space-y-3 bg-amber-50/50 p-3.5 rounded-2xl border border-amber-200/60">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-amber-800 mb-1">配息持有股數</label>
                                <input type="number" step="any" id="tx-div-shares" value="0" oninput="calculateDividendTotal()" placeholder="例 1000" class="w-full h-11 px-3 border border-amber-200 rounded-2xl text-xs bg-white focus:ring-2 focus:ring-amber-300 focus:outline-none transition">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-amber-800 mb-1">每股配息 (元)</label>
                                <input type="number" step="any" id="tx-div-per-share" value="0" oninput="calculateDividendTotal()" placeholder="例 1.5" class="w-full h-11 px-3 border border-amber-200 rounded-2xl text-xs bg-white focus:ring-2 focus:ring-amber-300 focus:outline-none transition">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">總金額 (台幣)</label>
                        <input type="number" step="any" id="tx-amount" required placeholder="總金額" class="w-full h-11 px-3.5 border border-morandi-200 rounded-2xl text-sm font-bold text-morandi-800 bg-morandi-100/40 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">備註 (選填)</label>
                        <input type="text" id="tx-note" placeholder="例如：定期定額、心得..." class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:outline-none transition">
                    </div>

                    <button type="submit" class="w-full h-12 bg-morandi-500 hover:bg-morandi-600 text-white font-medium rounded-2xl transition text-xs tracking-wide shadow-sm">確認送出紀錄</button>
                </form>
            </div>

            <!-- 分頁四：歷史明細 -->
            <div id="panel-history" class="hidden space-y-3">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="text-xs font-bold mb-3.5 text-morandi-800 tracking-wide flex items-center gap-1.5">📋 歷史明細</h3>
                    <div id="transaction-list" class="space-y-3"></div>
                </div>
            </div>

        </div>

    </main>

    <!-- 排序視窗 -->
    <div id="sort-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-xl border border-slate-100 space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-sm font-bold text-morandi-800 flex items-center gap-1.5">↕️ 追蹤清單排序設定</h3>
                <button onclick="closeSortModal()" class="text-slate-400 hover:text-slate-600 text-sm px-2 py-1">✕</button>
            </div>
            <div id="sort-list-container" class="space-y-2 overflow-y-auto flex-grow divide-y divide-slate-50"></div>
            <button onclick="closeSortModal()" class="w-full h-11 bg-morandi-500 hover:bg-morandi-600 text-white font-medium rounded-2xl transition text-xs shadow-sm">完成排序</button>
        </div>
    </div>

    <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 shadow-lg z-50 pt-2.5 pb-6 px-4">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchTab('summary')" id="tab-summary" class="flex flex-col items-center text-morandi-600 font-bold text-[10px] transition">
                <span class="text-base mb-0.5">📊</span>
                <span>持股總覽</span>
            </button>
            <button onclick="switchTab('market')" id="tab-market" class="flex flex-col items-center text-slate-400 font-medium text-[10px] transition">
                <span class="text-base mb-0.5">📈</span>
                <span>行情追蹤</span>
            </button>
            <button onclick="switchTab('add')" id="tab-add" class="flex flex-col items-center text-slate-400 font-medium text-[10px] transition">
                <span class="text-base mb-0.5">➕</span>
                <span>記帳登記</span>
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex flex-col items-center text-slate-400 font-medium text-[10px] transition">
                <span class="text-base mb-0.5">📋</span>
                <span>歷史明細</span>
            </button>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://yjdsvekbvzgkkvbgyoso.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_nyw5nDgN4fGMK_LsezMJug_25xMjLSz";

        let _supabase;
        try {
            const { createClient } = supabase;
            _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Supabase 初始化失敗:", err);
        }

        let stockMap = { '2330': '台積電', '0056': '元大高股息', '0050': '元大台灣50', '00919': '群益台灣精選高息', '00878': '國泰永續高息', '2317': '鴻海', '2303': '聯電' };
        let nameMap = { '台積電': '2330', '元大高股息': '0056', '元大台灣50': '0050', '群益台灣精選高息': '00919', '國泰永續高息': '00878', '鴻海': '2317', '聯電': '2303' };
        let stockTypeMap = {};
        let cachedTransactions = [];
        let expandedSymbols = {};
        let expandedMarketSymbols = {};
        let marketDataCache = {};
        let activeMarketTab = 'watchlist'; 
        let currentUser = null;
        let watchlist = ['2330', '0056', '00919', '00878', '2317', '2303'];

        async function loadUserWatchlist() {
            if (!currentUser) return;
            try {
                const { data: { user }, error } = await _supabase.auth.getUser();
                if (!error && user && user.user_metadata && user.user_metadata.watchlist) {
                    watchlist = user.user_metadata.watchlist;
                }
            } catch (err) {}
        }

        async function saveUserWatchlist() {
            if (!currentUser) return;
            try {
                await _supabase.auth.updateUser({
                    data: { watchlist: watchlist }
                });
            } catch (err) {}
        }

        function showEmailHistoryDropdown() {
            const savedEmails = JSON.parse(localStorage.getItem('saved_login_emails') || '[]');
            const dropdown = document.getElementById('email-history-dropdown');
            if (savedEmails.length === 0) { dropdown.classList.add('hidden'); return; }
            dropdown.innerHTML = savedEmails.map(email => `
                <div onclick="selectEmail('${email}')" class="px-4 py-2.5 text-xs text-slate-700 hover:bg-morandi-50 cursor-pointer flex justify-between items-center">
                    <span>${email}</span><span class="text-[10px] text-slate-400">歷史帳號</span>
                </div>
            `).join('');
            dropdown.classList.remove('hidden');
        }

        function hideEmailHistoryDropdown() { document.getElementById('email-history-dropdown').classList.add('hidden'); }
        function selectEmail(email) { document.getElementById('email').value = email; hideEmailHistoryDropdown(); }
        function saveEmailToLocalStorage(email) {
            if (!email || !email.includes('@')) return;
            email = email.trim().toLowerCase();
            let savedEmails = JSON.parse(localStorage.getItem('saved_login_emails') || '[]');
            savedEmails = savedEmails.filter(e => e !== email);
            savedEmails.unshift(email);
            if (savedEmails.length > 5) savedEmails = savedEmails.slice(0, 5);
            localStorage.setItem('saved_login_emails', JSON.stringify(savedEmails));
        }
        function loadInitialEmail() {
            const savedEmails = JSON.parse(localStorage.getItem('saved_login_emails') || '[]');
            const emailInput = document.getElementById('email');
            if (savedEmails.length > 0 && !emailInput.value) emailInput.value = savedEmails[0];
        }

        async function loadStockDictionary() {
            try {
                const { data, error } = await _supabase.from('stocks').select('*');
                if (!error && data && data.length > 0) {
                    data.forEach(item => {
                        stockMap[item.symbol] = item.name;
                        nameMap[item.name] = item.symbol;
                        stockTypeMap[item.symbol] = item.asset_type || 'stock';
                    });
                }
            } catch (err) {}
        }

        function onSymbolInput() {
            const symbol = document.getElementById('tx-symbol').value.trim().toUpperCase();
            const nameInput = document.getElementById('tx-name');
            if (symbol === "") nameInput.value = "";
            else if (stockMap[symbol]) nameInput.value = stockMap[symbol];
        }

        function onNameInput() {
            const name = document.getElementById('tx-name').value.trim();
            const symbolInput = document.getElementById('tx-symbol');
            if (name === "") symbolInput.value = "";
            else if (nameMap[name]) symbolInput.value = nameMap[name];
        }

        function onTypeChange() {
            const type = document.getElementById('tx-type').value;
            const symbolInput = document.getElementById('tx-symbol');
            const hintText = document.getElementById('fund-hint-text');
            if (type === 'fund') {
                symbolInput.placeholder = "例 A36004";
                hintText.classList.remove('hidden');
            } else {
                symbolInput.placeholder = "例 2330";
                hintText.classList.add('hidden');
            }
        }

        function onActionChange() {
            const action = document.getElementById('tx-action').value;
            const buySellFields = document.getElementById('buy-sell-fields');

        // 💡 透過 corsproxy.io 安全抓取 Yahoo Finance 真實行情與計算真實均線
        async function fetchMarketData(isBackground = false) {
            const btn = document.getElementById('refresh-market-btn');
            if (!isBackground && btn) { btn.disabled = true; btn.textContent = '⏳ 抓取真實行情中...'; }

            await loadStockDictionary();
            const activeSymbols = getActiveSymbolsList();
            const allSymbols = Array.from(new Set(['IX0001', '2330', '0056', '00919', '00878', '2317', '2303', ...activeSymbols, ...watchlist, ...Object.keys(stockMap)]));

            for (const sym of allSymbols) {
                if (sym === 'IX0001') {
                    marketDataCache[sym] = { symbol: 'IX0001', name: '台股加權指數', price: 23000, ma5: '22950', ma10: '22880', ma20: '22750', ma60: '22500', isFund: false };
                    continue;
                }

                if (checkIfFund(sym)) {
                    marketDataCache[sym] = { symbol: sym, name: stockMap[sym] || sym, price: 20.0, isFund: true };
                    continue;
                }

                try {
                    // 嘗試 .TW 與 .TWO 抓取 Yahoo Finance 數據
                    let yahooSym = sym + '.TW';
                    let url = `https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/${yahooSym}?range=3mo&interval=1d`;
                    let res = await fetch(url);
                    let data = await res.json();
                    
                    if (!data.chart || !data.chart.result || data.chart.result.length === 0) {
                        yahooSym = sym + '.TWO';
                        url = `https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/${yahooSym}?range=3mo&interval=1d`;
                        res = await fetch(url);
                        data = await res.json();
                    }

                    if (data.chart && data.chart.result && data.chart.result.length > 0) {
                        const result = data.chart.result[0];
                        const meta = result.meta;
                        const price = meta.regularMarketPrice || meta.chartPreviousClose || 0;
                        const quotes = result.indicators.quote[0].close.filter(v => v !== null);

                        const calcMA = (days) => {
                            if (quotes.length < days) return price.toFixed(1);
                            const slice = quotes.slice(-days);
                            const sum = slice.reduce((a, b) => a + b, 0);
                            return (sum / days).toFixed(1);
                        };

                        marketDataCache[sym] = {
                            symbol: sym,
                            name: stockMap[sym] || meta.shortName || sym,
                            price: price,
                            ma5: calcMA(5),
                            ma10: calcMA(10),
                            ma20: calcMA(20),
                            ma60: calcMA(60),
                            isFund: false
                        };
                    }
                } catch (e) {
                    // 若網路或跨域失敗，保留預設或前次資料
                    if (!marketDataCache[sym]) {
                        marketDataCache[sym] = { symbol: sym, name: stockMap[sym] || sym, price: 50.0, ma5: '49.0', ma10: '48.5', ma20: '48.0', ma60: '47.0', isFund: false };
                    }
                }
            }

            renderSummary();
            renderMarketList();

            if (!isBackground && btn) {
                btn.textContent = '✅ 更新完成';
                setTimeout(() => { btn.textContent = '🔄 更新行情'; btn.disabled = false; }, 1500);
            }
        }

        function getActiveSymbolsList() {
            const portfolio = {};
            cachedTransactions.forEach(tx => {
                const key = tx.symbol;
                if (!portfolio[key]) portfolio[key] = { shares: 0, totalCost: 0 };
                const shares = Number(tx.shares) || 0;
                const amount = Number(tx.amount) || 0;
                if (tx.action === 'BUY') { portfolio[key].shares += shares; portfolio[key].totalCost += amount; }
                else if (tx.action === 'SELL') { portfolio[key].shares -= shares; portfolio[key].totalCost -= amount; }
            });
            return Object.keys(portfolio).filter(k => portfolio[k].shares > 0 || portfolio[k].totalCost > 0);
        }

        function renderSummary() {
            const portfolio = {};
            let totalInvestedAll = 0, totalMarketValueAll = 0, totalDividendAll = 0;

            cachedTransactions.forEach(tx => {
                const key = tx.symbol;
                if (!portfolio[key]) {
                    const dbAssetType = stockTypeMap[key] || tx.asset_type || 'stock';
                    portfolio[key] = { symbol: tx.symbol, name: tx.name, asset_type: dbAssetType, shares: 0, totalCost: 0, dividends: 0, txs: [] };
                }
                portfolio[key].txs.push(tx);
                const shares = Number(tx.shares) || 0, amount = Number(tx.amount) || 0;
                if (tx.action === 'BUY') { portfolio[key].shares += shares; portfolio[key].totalCost += amount; totalInvestedAll += amount; }
                else if (tx.action === 'SELL') { portfolio[key].shares -= shares; portfolio[key].totalCost -= amount; totalInvestedAll -= amount; }
                else if (tx.action === 'DIVIDEND') { portfolio[key].dividends += amount; totalDividendAll += amount; }
            });

            const activeSymbols = Object.values(portfolio).filter(p => p.shares > 0 || p.totalCost > 0 || p.dividends > 0);
            activeSymbols.forEach(item => {
                const livePrice = marketDataCache[item.symbol] && marketDataCache[item.symbol].price > 0 && marketDataCache[item.symbol].price !== '--' ? Number(marketDataCache[item.symbol].price) : (item.shares > 0 ? item.totalCost / item.shares : 0);
                item.marketValue = item.shares * livePrice;
                totalMarketValueAll += item.marketValue;
            });

            const totalProfitAll = totalMarketValueAll - totalInvestedAll;
            const totalProfitPctAll = totalInvestedAll > 0 ? ((totalProfitAll / totalInvestedAll) * 100).toFixed(2) : 0;

            document.getElementById('total-market-value').textContent = `NT$ ${Math.round(totalMarketValueAll).toLocaleString()}`;
            document.getElementById('total-invested').textContent = `NT$ ${Math.round(totalInvestedAll).toLocaleString()}`;
            document.getElementById('total-dividend').textContent = `NT$ ${Math.round(totalDividendAll).toLocaleString()}`;
            document.getElementById('total-symbols').textContent = `${activeSymbols.length} 檔持有中`;

            const profitBox = document.getElementById('total-profit-box');
            if (totalProfitAll >= 0) {
                profitBox.innerHTML = `<span class="text-morandi-600">總未實現損益</span><b class="text-emerald-600">+NT$ ${Math.round(totalProfitAll).toLocaleString()} (+${totalProfitPctAll}%)</b>`;
            } else {
                profitBox.innerHTML = `<span class="text-morandi-600">總未實現損益</span><b class="text-rose-600">-NT$ ${Math.round(Math.abs(totalProfitAll)).toLocaleString()} (${totalProfitPctAll}%)</b>`;
            }

            const listEl = document.getElementById('portfolio-list');
            if (activeSymbols.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs shadow-sm border border-slate-100">目前沒有持有中的股票或基金</div>`;
                return;
            }

            listEl.innerHTML = activeSymbols.map(item => {
                const avgPrice = item.shares > 0 ? (item.totalCost / item.shares).toFixed(2) : 0;
                const isExpanded = !!expandedSymbols[item.symbol];
                const livePrice = marketDataCache[item.symbol] && marketDataCache[item.symbol].price > 0 && marketDataCache[item.symbol].price !== '--' ? Number(marketDataCache[item.symbol].price) : (item.shares > 0 ? Number(avgPrice) : 0);
                const marketVal = item.shares * livePrice;
                const profitAmt = marketVal - item.totalCost;
                const profitPct = item.totalCost > 0 ? ((profitAmt / item.totalCost) * 100).toFixed(2) : 0;
                const profitColor = profitAmt >= 0 ? 'text-emerald-600' : 'text-rose-600';
                const profitSign = profitAmt >= 0 ? '+' : '';
                const displayName = stockMap[item.symbol] || item.name || item.symbol;

                const subTxsHtml = item.txs.map(tx => {
                    let badge = tx.action === 'BUY' ? '<span class="text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md text-[10px]">買進</span>' : (tx.action === 'SELL' ? '<span class="text-emerald-700 bg-rose-50 px-2 py-0.5 rounded-md text-[10px]">賣出</span>' : '<span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md text-[10px]">配息</span>');
                    return `
                        <div class="bg-morandi-50/70 p-2.5 rounded-xl border border-morandi-100 flex justify-between items-center text-[11px]">
                            <div>
                                <div class="flex items-center gap-1.5 mb-0.5"><span class="text-slate-400">${tx.date}</span>${badge}</div>
                                <span class="text-slate-600">${tx.action === 'DIVIDEND' ? '配息入帳 (單位數: ' + tx.shares + ' | 每單位: ' + tx.price + ')' : '單位數: ' + tx.shares + ' | 淨值: ' + tx.price}</span>
                            </div>
                            <div class="text-right">
                                <span class="font-bold text-slate-800">NT$ ${Number(tx.amount).toLocaleString()}</span><br>
                                <button onclick="event.stopPropagation(); deleteTx(${tx.id})" class="text-rose-500 text-[10px] underline">刪除</button>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div onclick="toggleExpand('${item.symbol}')" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3 cursor-pointer hover:border-morandi-300 transition">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <span class="font-bold text-sm text-slate-800">${item.symbol}</span>
                                <span class="text-xs text-slate-500 truncate">${displayName}</span>
                                <span class="text-[10px] text-morandi-600 bg-morandi-100 px-2 py-0.5 rounded-md">${isExpanded ? '▲ 收合' : '▼ 明細'}</span>

                            <div><span class="text-slate-400">現值市值：</span><b>NT$ ${Math.round(marketVal).toLocaleString()}</b></div>
                            <div class="text-right"><span class="text-slate-400">未實現損益：</span><b class="${profitColor}">${profitSign}NT$ ${Math.round(Math.abs(profitAmt)).toLocaleString()} (${profitSign}${profitPct}%)</b></div>

                    detailsHtml = `
                        <div class="grid grid-cols-4 gap-2 pt-2 border-t border-slate-100 text-center text-xs">
                            <div class="bg-slate-50 p-2 rounded-2xl"><span class="text-[10px] text-slate-400 block">5日線</span><b class="text-slate-700">${ma5}</b></div>
                            <div class="bg-slate-50 p-2 rounded-2xl"><span class="text-[10px] text-slate-400 block">10日線</span><b class="text-slate-700">${ma10}</b></div>
                            <div class="bg-slate-50 p-2 rounded-2xl"><span class="text-[10px] text-slate-400 block">20日線</span><b class="text-slate-700">${ma20}</b></div>
                            <div class="bg-slate-50 p-2 rounded-2xl"><span class="text-[10px] text-slate-400 block">60日線</span><b class="text-slate-700">${ma60}</b></div>
                        </div>
                    `;
                }

                return `
                    <div onclick="toggleMarketExpand('${sym}')" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3 cursor-pointer hover:border-morandi-300 transition">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <button onclick="event.stopPropagation(); toggleWatchlist('${sym}')" class="text-lg">${isStarred ? '⭐' : '☆'}</button>
                                <span class="font-bold text-sm text-slate-800">${sym}</span>
                                <span class="text-xs text-slate-500 truncate">${stockName}</span>
                            </div>
                            <span class="text-xs font-bold ${isFund ? 'text-purple-700 bg-purple-100 border-purple-200' : 'text-morandi-800 bg-morandi-100 border-morandi-200'} px-2.5 py-1 rounded-xl border">${isFund ? '淨值' : '現價'}: ${price}</span>
                        </div>
                        ${detailsHtml}
                    </div>
                `;
            }).join('');
        }

        function renderHistoryList() {
            const listEl = document.getElementById('transaction-list');
            if (cachedTransactions.length === 0) { listEl.innerHTML = `<div class="text-center text-slate-400 text-xs py-4">目前尚無任何交易明細</div>`; return; }
            listEl.innerHTML = cachedTransactions.map(tx => {
                let badge = tx.action === 'BUY' ? '<span class="text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md text-[10px]">買進</span>' : (tx.action === 'SELL' ? '<span class="text-emerald-700 bg-rose-50 px-2 py-0.5 rounded-md text-[10px]">賣出</span>' : '<span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md text-[10px]">配息</span>');
                const displayName = stockMap[tx.symbol] || tx.name || tx.symbol;
                return `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-2">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2"><span class="text-xs text-slate-400">${tx.date}</span>${badge}</div>
                            <span class="font-bold text-slate-900">NT$ ${Number(tx.amount).toLocaleString()}</span>
                        </div>
                        <div class="text-sm font-bold text-slate-800"><span class="font-mono mr-1">${tx.symbol}</span><span>${displayName}</span></div>
                        <div class="flex justify-between items-end pt-1 border-t border-slate-200 text-xs text-slate-500">
                            <div><p>${tx.action === 'DIVIDEND' ? '配息入帳 (單位數: ' + tx.shares + ' | 每單位: ' + tx.price + ')' : '單位數: ' + tx.shares + ' | 淨值: ' + tx.price}</p></div>
                            <button onclick="deleteTx(${tx.id})" class="text-rose-500 underline">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadTransactions() {
            try {
                const { data, error } = await _supabase.from('transactions').select('*').order('date', { ascending: false });
                if (error) throw error;
                cachedTransactions = data || [];
                renderSummary(); renderHistoryList();
            } catch (err) {}
        }

        async function deleteTx(id) {
            if (!confirm('確定要刪除這筆紀錄嗎？')) return;
            const { error } = await _supabase.from('transactions').delete().eq('id', id);
            if (error) alert('刪除失敗：' + error.message);
            else loadTransactions();
        }

        checkUser().then(() => {
            fetchMarketData(true);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資理財小幫手</title>

    <!-- iOS Safari 專用 PWA 設定與莫蘭迪綠桌面圖示 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="投資小幫手">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='115' fill='%237a9387'/><path d='M120 360 L200 280 L280 320 L390 180' stroke='white' stroke-width='32' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M330 180 H390 V240' stroke='white' stroke-width='32' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='390' cy='180' r='18' fill='%23d3b88c'/></svg>">

    <!-- Android Chrome 專用 Manifest 連結 -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            50: '#f6f8f7',
                            100: '#eaf0ec',
                            200: '#d5e0d9',
                            300: '#b7c9c0',
                            400: '#91a89c',
                            500: '#6f887c',
                            600: '#566e63',
                            700: '#43564e',
                            800: '#36453f',
                            900: '#2d3a35',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-morandi-50 text-slate-700 min-h-screen flex flex-col pb-20 select-none font-sans antialiased">

    <!-- 頂部標題列 (明亮淺色版) -->
    <header class="bg-morandi-100/90 backdrop-blur-md text-morandi-800 border-b border-morandi-200/60 sticky top-0 z-50 pt-safe transition-colors duration-300">
        <div class="max-w-md mx-auto px-5 py-3.5 flex justify-between items-center">
            <h1 class="text-sm tracking-wide font-bold flex items-center gap-2 text-morandi-800">
                <span class="text-base">📈</span> 投資理財小幫手
            </h1>
            <div id="user-info" class="hidden flex items-center space-x-2.5">
                <span id="user-email" class="text-[11px] tracking-tight bg-morandi-200/80 text-morandi-800 px-2.5 py-1 rounded-full truncate max-w-[110px]"></span>
                <button onclick="handleLogout()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded-lg text-[11px] font-medium transition">登出</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-5 flex-grow w-full">

        <!-- 登入畫面 -->
        <div id="login-section" class="bg-white p-7 rounded-3xl shadow-sm border border-morandi-100 mt-8">
            <div class="text-center mb-7">
                <div class="w-12 h-12 bg-morandi-100 text-morandi-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">🌿</div>
                <h2 class="text-lg font-bold text-morandi-800 tracking-wide">使用者登入</h2>
                <p class="text-xs text-slate-400 mt-1">歡迎回到您的個人投資追蹤看板</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1 tracking-wider">EMAIL</label>
                    <input type="email" id="email" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:border-morandi-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1 tracking-wider">PASSWORD</label>
                    <input type="password" id="password" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl text-xs bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-morandi-300 focus:border-morandi-400 focus:outline-none transition">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-morandi-500 hover:bg-morandi-600 text-white font-medium py-3 rounded-2xl transition shadow-sm text-xs tracking-wide">登入系統</button>
                <p id="login-error" class="text-rose-600 text-xs text-center font-medium hidden mt-3 p-2.5 bg-rose-50 rounded-xl border border-rose-100"></p>
            </form>
        </div>

        <!-- 登入後的主畫面容器 -->
        <div id="app-section" class="hidden space-y-4">
            
            <!-- 分頁一：持股總覽 -->
            <div id="panel-summary" class="space-y-3.5">
                <!-- 總資產卡片 (淺色莫蘭迪綠高質感漸層) -->
                <div class="bg-gradient-to-br from-morandi-100 via-morandi-200/70 to-morandi-100 text-morandi-800 p-6 rounded-3xl shadow-sm border border-morandi-200/80 space-y-4 relative overflow-hidden">
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <p class="text-xs text-morandi-600 font-medium tracking-wide">總資產市值 (NTD)</p>
                            <h2 id="total-market-value" class="text-2xl font-bold mt-1 tracking-tight text-morandi-900">NT$ 0</h2>
                        </div>
                        <span id="total-symbols" class="text-[11px] bg-morandi-300/40 text-morandi-800 px-3 py-1 rounded-full font-medium tracking-wide border border-morandi-300/60">0 檔持有中</span>
                    </div>

                    <div class="grid grid-cols-2 pt-3 border-t border-morandi-300/50 text-xs relative z-10">
                        <div>
                            <span class="text-morandi-600 block text-[11px] mb-0.5">總投入成本</span>
                            <b id="total-invested" class="text-morandi-900 text-sm tracking-tight">NT$ 0</b>
                        </div>
                        <div class="text-right">
                            <span class="text-morandi-600 block text-[11px] mb-0.5">累積配息總額</span>
                            <b id="total-dividend" class="text-amber-700 text-sm tracking-tight">NT$ 0</b>
                        </div>
                    </div>

                    <div id="total-profit-box" class="pt-2.5 border-t border-morandi-300/50 text-xs flex justify-between items-center relative z-10">
                        <span class="text-morandi-600">總未實現損益</span>
                        <b class="text-morandi-900">NT$ 0 (0.00%)</b>
                    </div>
                </div>

                <div id="portfolio-list" class="space-y-3">
                    <!-- 動態載入持股彙整 -->
                </div>
            </div>

            <!-- 分頁二：行情追蹤 -->
            <div id="panel-market" class="hidden space-y-3.5">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <h3 class="text-xs font-bold text-morandi-800 tracking-wide">📈 市場行情與均線追蹤</h3>
                        <p class="text-[10px] text-slate-400 mt-0.5">台灣證交所 (TWSE) 官方即時/盤後價</p>
                    </div>
                    <button onclick="fetchMarketData()" class="bg-morandi-500 hover:bg-morandi-600 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-1.5">
                        🔄 更新行情
                    </button>
                </div>

                <div class="flex bg-slate-200/60 p-1 rounded-2xl shadow-inner text-xs">
                    <button onclick="switchMarketSubTab('watchlist')" id="subtab-watchlist" class="flex-1 py-1.5 font-bold rounded-xl transition bg-white text-morandi-700 shadow-sm">⭐ 我的追蹤</button>
                    <button onclick="switchMarketSubTab('all')" id="subtab-all" class="flex-1 py-1.5 font-bold rounded-xl transition text-slate-500">📋 全部標的</button>
                </div>

                <div id="market-list" class="space-y-3">
                    <!-- 動態載入行情與近五日走勢 -->
                </div>
            </div>

            <!-- 分頁三：記帳登記 -->
            <div id="panel-add" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="text-sm font-bold mb-4 text-morandi-800 tracking-wide flex items-center gap-1.5">✍️ 新增交易 / 配息紀錄</h3>
                <form id="transaction-form" onsubmit="handleAddTransaction(event)" class="space-y-3.5">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">日期</label>
                            <input type="date" id="tx-date" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">動作</label>
                            <select id="tx-action" onchange="onActionChange()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50/50 font-semibold text-morandi-700">
                                <option value="BUY">🟢 買進</option>
                                <option value="SELL">🔴 賣出</option>
                                <option value="DIVIDEND">💰 配息 / 股利</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">資產類型</label>
                            <select id="tx-type" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50/50">
                                <option value="stock">股票 / ETF</option>
                                <option value="fund">基金</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">代號</label>
                            <input type="text" id="tx-symbol" required placeholder="例 2330" oninput="onSymbolInput()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs uppercase">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">名稱</label>
                        <input type="text" id="tx-name" required placeholder="例 台積電" oninput="onNameInput()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                    </div>

                    <div id="buy-sell-fields" class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">股數/單位</label>
                            <input type="number" step="any" id="tx-shares" value="0" class="w-full px-2 py-2 border border-slate-200 rounded-xl text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">單價/淨值</label>
                            <input type="number" step="any" id="tx-price" value="0" class="w-full px-2 py-2 border border-slate-200 rounded-xl text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">手續費/稅</label>
                            <input type="number" step="any" id="tx-fee" value="0" class="w-full px-2 py-2 border border-slate-200 rounded-xl text-xs">
                        </div>
                    </div>

                    <div id="dividend-fields" class="hidden space-y-3 bg-amber-50/50 p-3.5 rounded-2xl border border-amber-200/60">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-amber-800 mb-1">配息持有股數</label>
                                <input type="number" step="any" id="tx-div-shares" value="0" oninput="calculateDividendTotal()" placeholder="例 1000" class="w-full px-2.5 py-2 border border-amber-200 rounded-xl text-xs bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-amber-800 mb-1">每股配息 (元)</label>
                                <input type="number" step="any" id="tx-div-per-share" value="0" oninput="calculateDividendTotal()" placeholder="例 1.5" class="w-full px-2.5 py-2 border border-amber-200 rounded-xl text-xs bg-white">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">總金額 (台幣)</label>
                        <input type="number" step="any" id="tx-amount" required placeholder="總金額" class="w-full px-3.5 py-2.5 border border-morandi-200 rounded-2xl text-sm font-bold text-morandi-800 bg-morandi-100/40">
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">備註 (選填)</label>
                        <input type="text" id="tx-note" placeholder="例如：定期定額、心得..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                    </div>

                    <button type="submit" class="w-full bg-morandi-500 hover:bg-morandi-600 text-white font-medium py-3 rounded-2xl transition text-xs tracking-wide shadow-sm">確認送出紀錄</button>
                </form>
            </div>

            <!-- 分頁四：歷史明細 -->
            <div id="panel-history" class="hidden space-y-3">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="text-xs font-bold mb-3 text-morandi-800 tracking-wide">📋 歷史明細</h3>
                    <div id="transaction-list" class="space-y-2.5">
                        <!-- 動態載入歷史明細 -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- 底部固定導航列 (淺色莫蘭迪質感) -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 shadow-lg z-50 py-2.5 px-4 pb-safe">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchTab('summary')" id="tab-summary" class="flex flex-col items-center text-morandi-600 font-bold text-[10px] transition">
                <span class="text-base mb-0.5">📊</span>
                <span>持股總覽</span>
            </button>
            <button onclick="switchTab('market')" id="tab-market" class="flex flex-col items-center text-slate-400 font-medium text-[10px] transition">
                <span class="text-base mb-0.5">📈</span>
                <span>行情追蹤</span>
            </button>
            <button onclick="switchTab('add')" id="tab-add" class="flex flex-col items-center text-slate-400 font-medium text-[10px] transition">
                <span class="text-base mb-0.5">➕</span>
                <span>記帳登記</span>
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex flex-col items-center text-slate-400 font-medium text-[10px] transition">
                <span class="text-base mb-0.5">📋</span>
                <span>歷史明細</span>
            </button>
        </div>
    </nav>

    <!-- App 核心邏輯 -->
    <script>
        const SUPABASE_URL = "https://yjdsvekbvzgkkvbgyoso.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_nyw5nDgN4fGMK_LsezMJug_25xMjLSz";

        let _supabase;
        try {
            const { createClient } = supabase;
            _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Supabase 初始化失敗:", err);
        }

        let stockMap = {
            "2330": "台積電",
            "0050": "元大台灣50",
            "00878": "國泰永續高股息",
            "00919": "群益台灣精選高息",
            "00981A": "統一台灣增長主動式ETF",
            "2317": "鴻海",
            "2454": "聯發科"
        };
        let nameMap = Object.fromEntries(Object.entries(stockMap).map(([k, v]) => [v, k]));
        let cachedTransactions = [];
        let expandedSymbols = {};
        let expandedMarketSymbols = {};
        let marketDataCache = {};
        let marketSubTab = 'watchlist';
        let watchlist = JSON.parse(localStorage.getItem('my_watchlist') || '["2330", "00891"]');

        async function loadStockDictionary() {
            try {
                const { data, error } = await _supabase.from('stocks').select('*');
                if (!error && data && data.length > 0) {
                    data.forEach(item => {
                        stockMap[item.symbol] = item.name;
                        nameMap[item.name] = item.symbol;
                    });
                }
            } catch (err) {
                console.error("載入股票字典例外:", err);
            }
        }

        function onSymbolInput() {
            const symbol = document.getElementById('tx-symbol').value.trim().toUpperCase();
            const nameInput = document.getElementById('tx-name');
            if (symbol === "") {
                nameInput.value = "";
            } else if (stockMap[symbol]) {
                nameInput.value = stockMap[symbol];
            }
        }

        function onNameInput() {
            const name = document.getElementById('tx-name').value.trim();
            const symbolInput = document.getElementById('tx-symbol');
            if (name === "") {
                symbolInput.value = "";
            } else if (nameMap[name]) {
                symbolInput.value = nameMap[name];
            }
        }

        function onActionChange() {
            const action = document.getElementById('tx-action').value;
            const buySellFields = document.getElementById('buy-sell-fields');
            const dividendFields = document.getElementById('dividend-fields');
            const amountInput = document.getElementById('tx-amount');

            if (action === 'DIVIDEND') {
                buySellFields.classList.add('hidden');
                dividendFields.classList.remove('hidden');
                amountInput.value = '';
                amountInput.placeholder = "輸入上方股數與每股配息自動計算";
            } else {
                buySellFields.classList.remove('hidden');
                dividendFields.classList.add('hidden');
                amountInput.placeholder = "總金額";
            }
        }

        function calculateDividendTotal() {
            const shares = parseFloat(document.getElementById('tx-div-shares').value) || 0;
            const perShare = parseFloat(document.getElementById('tx-div-per-share').value) || 0;
            const total = shares * perShare;
            document.getElementById('tx-amount').value = total > 0 ? Math.round(total * 100) / 100 : '';
        }

        document.getElementById('tx-date').valueAsDate = new Date();

        function switchTab(tab) {
            const tabs = ['summary', 'market', 'add', 'history'];
            tabs.forEach(t => {
                document.getElementById(`panel-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                if (btn) btn.className = "flex flex-col items-center text-slate-400 font-medium text-[10px] transition";
            });
            
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) activeBtn.className = "flex flex-col items-center text-morandi-600 font-bold text-[10px] transition";

            if (tab === 'market') {
                renderMarketList();
            }
        }

        function switchMarketSubTab(sub) {
            marketSubTab = sub;
            if (sub === 'watchlist') {
                document.getElementById('subtab-watchlist').className = "flex-1 py-1.5 font-bold rounded-xl transition bg-white text-morandi-700 shadow-sm";
                document.getElementById('subtab-all').className = "flex-1 py-1.5 font-bold rounded-xl transition text-slate-500";
            } else {
                document.getElementById('subtab-watchlist').className = "flex-1 py-1.5 font-bold rounded-xl transition text-slate-500";
                document.getElementById('subtab-all').className = "flex-1 py-1.5 font-bold rounded-xl transition bg-white text-morandi-700 shadow-sm";
            }
            renderMarketList();
        }

        function toggleWatchlist(sym) {
            const index = watchlist.indexOf(sym);
            if (index > -1) {
                watchlist.splice(index, 1);
            } else {
                watchlist.push(sym);
            }
            localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
            renderMarketList();
        }

        async function checkUser() {
            try {
                const { data: { session }, error } = await _supabase.auth.getSession();
                if (error) throw error;
                if (session) {
                    showApp(session.user);
                } else {
                    showLogin();
                }
            } catch (err) {
                showLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            
            errEl.classList.add('hidden');
            errEl.textContent = '';
            loginBtn.textContent = '登入中...';
            loginBtn.disabled = true;

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                if (data && data.session) {
                    showApp(data.session.user);
                }
            } catch (err) {
                errEl.textContent = "登入失敗：" + (err.message || "未知錯誤");
                errEl.classList.remove('hidden');
            } finally {
                loginBtn.textContent = '登入系統';
                loginBtn.disabled = false;
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            showLogin();
        }

        function showLogin() {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
        }

        async function showApp(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email').textContent = user.email;
            
            await loadStockDictionary();
            loadTransactions();
        }

        async function handleAddTransaction(e) {
            e.preventDefault();
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return alert('尚未登入');

            const symbol = document.getElementById('tx-symbol').value.trim().toUpperCase();
            const name = document.getElementById('tx-name').value.trim();
            const action = document.getElementById('tx-action').value;

            let shares = 0, price = 0, fee = 0, amount = 0;

            if (action === 'DIVIDEND') {
                shares = parseFloat(document.getElementById('tx-div-shares').value) || 0;
                price = parseFloat(document.getElementById('tx-div-per-share').value) || 0;
                amount = parseFloat(document.getElementById('tx-amount').value) || 0;
            } else {
                shares = parseFloat(document.getElementById('tx-shares').value) || 0;
                price = parseFloat(document.getElementById('tx-price').value) || 0;
                fee = parseFloat(document.getElementById('tx-fee').value) || 0;
                amount = parseFloat(document.getElementById('tx-amount').value) || 0;
            }

            const newTx = {
                user_id: session.user.id,
                date: document.getElementById('tx-date').value,
                asset_type: document.getElementById('tx-type').value,
                action: action,
                symbol: symbol,
                name: name,
                shares: shares,
                price: price,
                fee: fee,
                amount: amount,
                note: document.getElementById('tx-note').value
            };

            const { error } = await _supabase.from('transactions').insert([newTx]);
            if (error) {
                alert('新增失敗：' + error.message);
                return;
            }

            if (symbol && name && !stockMap[symbol]) {
                await _supabase.from('stocks').upsert([{ symbol: symbol, name: name }]);
                await loadStockDictionary();
            }

            document.getElementById('transaction-form').reset();
            document.getElementById('tx-date').valueAsDate = new Date();
            onActionChange();
            loadTransactions();
            switchTab('summary');
        }

        function toggleExpand(symbol) {
            expandedSymbols[symbol] = !expandedSymbols[symbol];
            renderSummary();
        }

        function toggleMarketExpand(symbol) {
            expandedMarketSymbols[symbol] = !expandedMarketSymbols[symbol];
            renderMarketList();
        }

        async function fetchMarketData() {
            const activeSymbols = getActiveSymbolsList();
            const allSymbolsToFetch = Array.from(new Set([...activeSymbols, ...watchlist, Object.keys(stockMap)]));
            
            if (allSymbolsToFetch.length === 0) {
                alert('目前沒有標的可以查詢行情。');
                return;
            }

            alert('正在向證交所官方 API 查詢最新即時股價與均線，請稍候...');

            for (const sym of allSymbolsToFetch) {
                try {
                    const { data, error } = await _supabase.functions.invoke('get-stock-price', {
                        body: { symbol: sym }
                    });
                    if (!error && data) {
                        marketDataCache[sym] = data;
                    }
                } catch (err) {
                    console.error(`取得 ${sym} 行情失敗:`, err);
                }
            }

            renderSummary();
            renderMarketList();
            alert('台灣證交所行情更新完成！');
        }

        function getActiveSymbolsList() {
            const portfolio = {};
            cachedTransactions.forEach(tx => {
                const key = tx.symbol;
                if (!portfolio[key]) portfolio[key] = { shares: 0, totalCost: 0 };
                const shares = Number(tx.shares) || 0;
                const amount = Number(tx.amount) || 0;
                if (tx.action === 'BUY') {
                    portfolio[key].shares += shares;
                    portfolio[key].totalCost += amount;
                } else if (tx.action === 'SELL') {
                    portfolio[key].shares -= shares;
                    portfolio[key].totalCost -= amount;
                }
            });
            return Object.keys(portfolio).filter(k => portfolio[k].shares > 0 || portfolio[k].totalCost > 0);
        }

        function renderSummary() {
            const portfolio = {};
            let totalInvestedAll = 0;
            let totalMarketValueAll = 0;
            let totalDividendAll = 0;

            cachedTransactions.forEach(tx => {
                const key = tx.symbol;
                if (!portfolio[key]) {
                    portfolio[key] = {
                        symbol: tx.symbol,
                        name: tx.name,
                        asset_type: tx.asset_type,
                        shares: 0,
                        totalCost: 0,
                        dividends: 0,
                        txs: []
                    };
                }

                portfolio[key].txs.push(tx);

                const shares = Number(tx.shares) || 0;
                const amount = Number(tx.amount) || 0;

                if (tx.action === 'BUY') {
                    portfolio[key].shares += shares;
                    portfolio[key].totalCost += amount;
                    totalInvestedAll += amount;
                } else if (tx.action === 'SELL') {
                    portfolio[key].shares -= shares;
                    portfolio[key].totalCost -= amount;
                    totalInvestedAll -= amount;
                } else if (tx.action === 'DIVIDEND') {
                    portfolio[key].dividends += amount;
                    totalDividendAll += amount;
                }
            });

            const activeSymbols = Object.values(portfolio).filter(p => p.shares > 0 || p.totalCost > 0 || p.dividends > 0);

            activeSymbols.forEach(item => {
                const livePrice = marketDataCache[item.symbol] ? marketDataCache[item.symbol].price : (item.shares > 0 ? item.totalCost / item.shares : 0);
                item.marketValue = item.shares * livePrice;
                totalMarketValueAll += item.marketValue;
            });

            const totalProfitAll = totalMarketValueAll - totalInvestedAll;
            const totalProfitPctAll = totalInvestedAll > 0 ? ((totalProfitAll / totalInvestedAll) * 100).toFixed(2) : 0;

            document.getElementById('total-market-value').textContent = `NT$ ${Math.round(totalMarketValueAll).toLocaleString()}`;
            document.getElementById('total-invested').textContent = `NT$ ${Math.round(totalInvestedAll).toLocaleString()}`;
            document.getElementById('total-dividend').textContent = `NT$ ${Math.round(totalDividendAll).toLocaleString()}`;
            document.getElementById('total-symbols').textContent = `${activeSymbols.length} 檔持有中`;

            const profitBox = document.getElementById('total-profit-box');
            if (totalProfitAll >= 0) {
                profitBox.innerHTML = `<span class="text-morandi-600">總未實現損益</span><b class="text-emerald-600">+NT$ ${Math.round(totalProfitAll).toLocaleString()} (+${totalProfitPctAll}%)</b>`;
            } else {
                profitBox.innerHTML = `<span class="text-morandi-600">總未實現損益</span><b class="text-rose-600">-NT$ ${Math.round(Math.abs(totalProfitAll)).toLocaleString()} (${totalProfitPctAll}%)</b>`;
            }

            const listEl = document.getElementById('portfolio-list');
            if (activeSymbols.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs shadow-sm border border-slate-100">目前沒有持有中的股票或基金</div>`;
                return;
            }

            listEl.innerHTML = activeSymbols.map(item => {
                const avgPrice = item.shares > 0 ? (item.totalCost / item.shares).toFixed(2) : 0;
                const isExpanded = !!expandedSymbols[item.symbol];

                const livePrice = marketDataCache[item.symbol] ? marketDataCache[item.symbol].price : (item.shares > 0 ? Number(avgPrice) : 0);
                const marketVal = item.shares * livePrice;
                const profitAmt = marketVal - item.totalCost;
                const profitPct = item.totalCost > 0 ? ((profitAmt / item.totalCost) * 100).toFixed(2) : 0;

                const profitColor = profitAmt >= 0 ? 'text-emerald-600' : 'text-rose-600';
                const profitSign = profitAmt >= 0 ? '+' : '';

                const subTxsHtml = item.txs.map(tx => {
                    let badge = '';
                    if (tx.action === 'BUY') badge = '<span class="text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md text-[10px] font-medium">買進</span>';
                    else if (tx.action === 'SELL') badge = '<span class="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md text-[10px] font-medium">賣出</span>';
                    else badge = '<span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md text-[10px] font-medium">配息</span>';

                    return `
                        <div class="bg-morandi-50/70 p-2.5 rounded-xl border border-morandi-100 flex justify-between items-center text-[11px]">
                            <div>
                                <div class="flex items-center gap-1.5 mb-0.5">
                                    <span class="text-slate-400">${tx.date}</span>
                                    ${badge}
                                </div>
                                <span class="text-slate-600">${tx.action === 'DIVIDEND' ? '配息入帳 (股數: ' + tx.shares + ' | 每股: ' + tx.price + ')' : '股數: ' + tx.shares + ' | 單價: ' + tx.price}</span>
                                ${tx.note ? '<span class="text-slate-400 ml-1">(' + tx.note + ')</span>' : ''}
                            </div>
                            <div class="text-right">
                                <span class="font-bold text-slate-800">NT$ ${Number(tx.amount).toLocaleString()}</span>
                                <br>
                                <button onclick="event.stopPropagation(); deleteTx(${tx.id})" class="text-rose-500 hover:text-rose-700 text-[10px] underline mt-0.5">刪除</button>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div onclick="toggleExpand('${item.symbol}')" class="bg-white p-4.5 rounded-3xl shadow-sm border border-slate-100 space-y-2.5 cursor-pointer hover:border-morandi-300 transition">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm text-slate-800 tracking-wide">${item.symbol}</span>
                                <span class="text-xs text-slate-500">${item.name}</span>
                                <span class="text-[10px] text-morandi-600 bg-morandi-100 px-2 py-0.5 rounded-md">${isExpanded ? '▲ 收合' : '▼ 明細'}</span>
                            </div>
                            <span class="text-[10px] px-2.5 py-0.5 rounded-full font-medium ${item.asset_type === 'stock' ? 'bg-morandi-100 text-morandi-800' : 'bg-purple-50 text-purple-700'}">${item.asset_type === 'stock' ? '股票/ETF' : '基金'}</span>
                        </div>
                        <div class="grid grid-cols-2 pt-2 border-t border-slate-100/80 text-xs">
                            <div>
                                <span class="text-slate-400">持有股數：</span><b class="text-morandi-700">${item.shares.toLocaleString()}</b>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400">平均成本：</span><b>${Number(avgPrice).toLocaleString()}</b>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 text-xs pt-1">
                            <div>
                                <span class="text-slate-400">投入淨額：</span><b>NT$ ${Math.round(item.totalCost).toLocaleString()}</b>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400">累積配息：</span><b class="text-amber-700">NT$ ${Math.round(item.dividends).toLocaleString()}</b>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 text-xs pt-1 border-t border-slate-100/80">
                            <div>
                                <span class="text-slate-400">現值市值：</span><b>NT$ ${Math.round(marketVal).toLocaleString()}</b>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400">未實現損益：</span><b class="${profitColor}">${profitSign}NT$ ${Math.round(Math.abs(profitAmt)).toLocaleString()} (${profitSign}${profitPct}%)</b>
                            </div>
                        </div>

                        ${isExpanded ? `
                            <div class="pt-3 mt-2 border-t border-slate-100 space-y-2 cursor-default" onclick="event.stopPropagation()">
                                <p class="text-[11px] font-bold text-morandi-700 mb-1">📦 分批投入與配息明細：</p>
                                ${subTxsHtml}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderMarketList() {
            const listEl = document.getElementById('market-list');
            
            const activeSymbols = getActiveSymbolsList();
            const allSymbolsMap = {};
            activeSymbols.forEach(s => allSymbolsMap[s] = stockMap[s] || s);
            Object.keys(stockMap).forEach(s => allSymbolsMap[s] = stockMap[s]);
            watchlist.forEach(s => { if(!allSymbolsMap[s]) allSymbolsMap[s] = stockMap[s] || s; });

            let targetSymbols = [];
            if (marketSubTab === 'watchlist') {
                targetSymbols = watchlist;
            } else {
                targetSymbols = Object.keys(allSymbolsMap);
            }

            if (targetSymbols.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs shadow-sm border border-slate-100">目前沒有追蹤的標的，請在「全部」標的點擊星星加入追蹤</div>`;
                return;
            }

            listEl.innerHTML = targetSymbols.map(sym => {
                const info = marketDataCache[sym];
                const stockName = stockMap[sym] || sym;
                const price = info ? info.price : '--';
                const ma5 = info ? info.ma5 : '--';
                const ma10 = info ? info.ma10 : '--';
                const ma20 = info ? info.ma20 : '--';
                const ma60 = info ? info.ma60 : '--';
                const isStarred = watchlist.includes(sym);
                const isExpanded = !!expandedMarketSymbols[sym];

                let fiveDaysHtml = `<p class="text-[11px] text-slate-400 text-center py-2">尚未載入近五日收盤明細，請點擊上方「更新行情」</p>`;
                if (info && info.history && info.history.length > 0) {
                    fiveDaysHtml = info.history.map((h, idx, arr) => {
                        let changeSign = '';
                        let changeColor = 'text-slate-600';
                        if (idx > 0) {
                            const prevClose = arr[idx - 1].close;
                            const diff = h.close - prevClose;
                            const pct = ((diff / prevClose) * 100).toFixed(2);
                            changeSign = diff >= 0 ? `+${diff.toFixed(2)} (+${pct}%)` : `${diff.toFixed(2)} (${pct}%)`;
                            changeColor = diff >= 0 ? 'text-emerald-600 font-bold' : 'text-rose-600 font-bold';
                        } else {
                            changeSign = '基準日';
                        }

                        return `
                            <div class="flex justify-between items-center bg-morandi-50/70 px-3 py-2 rounded-xl text-[11px]">
                                <span class="text-slate-500 font-medium">${h.date}</span>
                                <span class="text-slate-800">收盤: <b>${h.close}</b></span>
                                <span class="${changeColor}">${changeSign}</span>
                            </div>
                        `;
                    }).join('');
                }

                return `
                    <div onclick="toggleMarketExpand('${sym}')" class="bg-white p-4.5 rounded-3xl shadow-sm border border-slate-100 space-y-3 cursor-pointer hover:border-morandi-300 transition">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <button onclick="event.stopPropagation(); toggleWatchlist('${sym}')" class="text-lg focus:outline-none" title="加入/移除追蹤">
                                    ${isStarred ? '⭐' : '☆'}
                                </button>
                                <span class="font-bold text-sm text-slate-800 tracking-wide">${sym}</span>
                                <span class="text-xs text-slate-500">${stockName}</span>
                                <span class="text-[10px] text-morandi-600 bg-morandi-100 px-2 py-0.5 rounded-md">${isExpanded ? '▲ 收合' : '▼ 近五日'}</span>
                            </div>
                            <span class="text-xs font-bold text-morandi-800 bg-morandi-100/70 px-2.5 py-1 rounded-xl border border-morandi-200/50">現價: ${price}</span>
                        </div>
                        <div class="grid grid-cols-4 gap-2 pt-2 border-t border-slate-100/80 text-center text-xs">
                            <div class="bg-slate-50 p-2 rounded-2xl">
                                <span class="text-[10px] text-slate-400 block">5日線</span>
                                <b class="text-slate-700">${ma5}</b>
                            </div>
                            <div class="bg-slate-50 p-2 rounded-2xl">
                                <span class="text-[10px] text-slate-400 block">10日線</span>
                                <b class="text-slate-700">${ma10}</b>
                            </div>
                            <div class="bg-slate-50 p-2 rounded-2xl">
                                <span class="text-[10px] text-slate-400 block">20日線</span>
                                <b class="text-slate-700">${ma20}</b>
                            </div>
                            <div class="bg-slate-50 p-2 rounded-2xl">
                                <span class="text-[10px] text-slate-400 block">60日線</span>
                                <b class="text-slate-700">${ma60}</b>
                            </div>
                        </div>

                        ${isExpanded ? `
                            <div class="pt-3 mt-2 border-t border-slate-100 space-y-1.5 cursor-default" onclick="event.stopPropagation()">
                                <p class="text-[11px] font-bold text-morandi-700 mb-1">📅 近五日開盤收盤與漲幅走勢：</p>
                                ${fiveDaysHtml}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderHistoryList() {
            const listEl = document.getElementById('transaction-list');
            if (cachedTransactions.length === 0) {
                listEl.innerHTML = `<div class="text-center text-slate-400 text-xs py-4">目前尚無任何交易明細</div>`;
                return;
            }

            listEl.innerHTML = cachedTransactions.map(tx => {
                let badge = '';
                if (tx.action === 'BUY') badge = '<span class="text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md text-[10px] font-medium">買進</span>';
                else if (tx.action === 'SELL') badge = '<span class="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md text-[10px] font-medium">賣出</span>';
                else badge = '<span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md text-[10px] font-medium">配息</span>';

                return `
                    <div class="bg-slate-50/70 p-3 rounded-2xl border border-slate-100 flex justify-between items-center text-xs">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-slate-400">${tx.date}</span>
                                ${badge}
                                <span class="font-bold text-slate-800">${tx.symbol} (${tx.name})</span>
                            </div>
                            <p class="text-slate-600">${tx.action === 'DIVIDEND' ? '配息入帳 (股數: ' + tx.shares + ' | 每股: ' + tx.price + ')' : '股數: ' + tx.shares + ' | 單價: ' + tx.price}</p>
                            ${tx.note ? '<p class="text-slate-400 mt-0.5">備註: ' + tx.note + '</p>' : ''}
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-slate-800 text-sm">NT$ ${Number(tx.amount).toLocaleString()}</p>
                            <button onclick="deleteTx(${tx.id})" class="text-rose-500 hover:text-rose-700 text-[10px] mt-1 underline">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadTransactions() {
            try {
                const { data, error } = await _supabase
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;
                cachedTransactions = data || [];
                renderSummary();
                renderHistoryList();
            } catch (err) {
                console.error("載入交易紀錄失敗:", err);
            }
        }

        async function deleteTx(id) {
            if (!confirm('確定要刪除這筆紀錄嗎？')) return;
            const { error } = await _supabase.from('transactions').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                loadTransactions();
            }
        }

        checkUser();
    </script>
</body>
</html>
